<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Almost ready</title>
<link rel="icon" href="favicon.ico" sizes="32x32"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #f2f2f7; --card: #fff; --text: #000; --sec: rgba(60,60,67,.6); --blue: #007aff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #fff; --sec: rgba(235,235,245,.6); --blue: #0a84ff; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  main { width: min(420px, 100%); padding: 32px 24px; border-radius: 24px; background: var(--card); text-align: center; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin-bottom: 8px; }
  p { color: var(--sec); }
  a { display: block; margin-top: 24px; padding: 14px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Your page is almost ready</h1>
  <p>This link works. Open the editor to design your page, then publish it here.</p>
  <a href="editor/">Open the editor</a>
</main>
</body>
</html>
